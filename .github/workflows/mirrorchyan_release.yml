name: mirrorchyan_release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to upload (blank uses latest release)
        default: ''
        required: false
        type: string
  release:
    types: [published]

jobs:
  mirrorchyan:
    if: ${{ github.repository_owner == 'LBEILC' }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: win
            arch: x64
            filename: 'Pane-Setup-*.exe'
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: Pane
          tag: ${{ inputs.tag }}

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: LBEILC
          repo: Pane
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}